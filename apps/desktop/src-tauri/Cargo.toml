[package]
name = "goodtype-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
goodtype-core = { path = "../../../crates/goodtype-core" }
goodtype-typst = { path = "../../../crates/goodtype-typst" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
# Decode only bounded saved calculation PNG/JPEG outputs for helper context.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
# Reuse the Markdown parser already pinned by goodtype-typst for addon README blocks.
pulldown-cmark = { version = "0.13", default-features = false }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile.workspace = true
# Optional Goodnotes importer (ADR 0029): the pinned-release download (ureq/native-tls are
# already built for Typst packages), reading its ZIP, and Job Objects for the converter process.
native-tls = "0.2"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
# Explicit importer update checks authenticate release metadata with an app-pinned key (ADR 0031).
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }

# ADR 0041: local MCP server over the authenticated async pipe transport.
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "macros", "transport-async-rw"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros"] }
getrandom = "0.3"
# Reuse the pinned Typst parser to capture literal transitive grant dependencies.
typst-syntax = "=0.15.1"
# Validate the identity and entry point in ordinary Typst package metadata.
toml = "1"
# ADR 0050: compiled capability-free runtime; execution requires the wasm-tier opt-in.
extism = { version = "=1.41.0", default-features = false }
# Hold Extism's runtime to the patched ADR 0050 release line.
wasmtime = { version = "=49.0.7", default-features = false }
# Inspect module declarations before either engine compiles them.
wasmparser = { version = "=0.258.3" }

[dev-dependencies]
rmcp = { version = "=3.8.0", default-features = false, features = ["client"] }
# Construct hostile Wasm fixtures to exercise W1 admission and interruption.
wat = "=1.263.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
] }
# Handwriting transcription through the recognizers Windows ships (ADR 0040). The same `windows`
# release Tauri and WebView2 already build; only these API features are added.
windows = { version = "0.61", features = [
  "Foundation",
  "UI_Input_Inking",
  "Win32_System_Com",
] }
windows-collections = "0.2"

[features]
wasm-tier = []
wasm-spike = ["wasm-tier"]

